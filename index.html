<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1F26" />
    <title>MotoGest</title>
    <!-- Aplica a classe "dark" antes do primeiro paint, lendo o mesmo storage
         que src/store/themeStore.ts usa — sem isso, a tela aparece no tema
         claro por um instante e só troca pro escuro depois que o React monta
         e reidrata o Zustand (flash de tema errado). -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('motogest.tema');
          var modo = salvo ? JSON.parse(salvo).state.mode : 'system';
          var escuro = modo === 'dark' || (modo === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
