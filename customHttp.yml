# Cabeçalhos HTTP do Amplify Hosting. Complementa o aviso de atualização do
# PWA (src/components/ui/UpdatePrompt.tsx): o navegador/CDN nunca pode servir
# a "casca" do app (index.html, service worker) de cache, senão o aviso de
# nova versão nem chega. Os assets em /assets têm hash no nome, então podem
# ser guardados "para sempre".
customHeaders:
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/registerSW.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
